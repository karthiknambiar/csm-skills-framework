[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "csaf"
version = "0.1.0"
description = "A memory-first framework for reusable Customer Success AI skills"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CSAF contributors" }]
keywords = ["customer-success", "ai", "skills", "framework"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx2>=2,<3",
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
csaf = "csaf.cli.app:main"

[project.urls]
Documentation = "https://github.com/karthiknambiar/csm-skills-framework#readme"
Source = "https://github.com/karthiknambiar/csm-skills-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/csaf"]

[tool.csaf.native-runtime]
python-version = "3.12"
implementation = "cp"
abi = "cp312"
dependencies = [
  "fastapi==0.141.1", "starlette==1.6.0", "pydantic==2.13.4",
  "pydantic-core==2.46.4", "annotated-types==0.8.0", "annotated-doc==0.0.5",
  "typing-extensions==4.16.0", "typing-inspection==0.4.4", "typer==0.27.1",
  "click==8.4.2", "colorama==0.4.6", "shellingham==1.5.4", "rich==15.0.0",
  "markdown-it-py==4.2.0", "mdurl==0.1.2", "pygments==2.21.0",
  "uvicorn==0.52.4", "h11==0.16.0", "anyio==4.14.2", "idna==3.19",
]

[tool.csaf.native-runtime.platform-tags]
linux-arm64 = "manylinux_2_17_aarch64"
linux-x64 = "manylinux_2_17_x86_64"
macos-arm64 = "macosx_11_0_arm64"
macos-x64 = "macosx_10_12_x86_64"
windows-arm64 = "win_arm64"
windows-x64 = "win_amd64"

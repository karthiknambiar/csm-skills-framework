[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "csaf"
version = "0.1.0.dev0"
description = "A memory-first framework for reusable Customer Success AI skills"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CSAF contributors" }]
keywords = ["customer-success", "ai", "skills", "framework"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx2>=2,<3",
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
csaf = "csaf.cli.app:main"

[project.urls]
Documentation = "https://github.com/karthiknambiar/csm-skills-framework#readme"
Source = "https://github.com/karthiknambiar/csm-skills-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/csaf"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

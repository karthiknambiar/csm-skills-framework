name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python scripts/check_secrets.py --worktree --tracked --history
      - run: pytest
      - run: csaf evaluate evaluations/golden --report evaluation-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evaluation-report-${{ matrix.python-version }}
          path: evaluation-report.json

  native-offline-smoke:
    name: Native offline smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
            smoke-python: ../.native-smoke/bin/python
            smoke_csaf: ../.native-smoke/bin/csaf
            verifier-csaf: .native-smoke/bin/csaf
          - runner: macos-latest
            platform: macos-x64
            smoke-python: ../.native-smoke/bin/python
            smoke_csaf: ../.native-smoke/bin/csaf
            verifier-csaf: .native-smoke/bin/csaf
          - runner: windows-latest
            platform: windows-x64
            smoke-python: ../.native-smoke/Scripts/python.exe
            smoke_csaf: ../.native-smoke/Scripts/csaf.exe
            verifier-csaf: .native-smoke/Scripts/csaf.exe
    env:
      CSAF_INSTALLER_NETWORK_FORBIDDEN: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip --version

      - run: python -m pip install --require-hashes -r requirements/release-tools.txt
      - run: python -m build --wheel --no-isolation
      - name: Assemble deterministic bundles (network is used only for exact PyPI wheel acquisition)
        env:
          CSAF_INSTALLER_NETWORK_FORBIDDEN: "0"
        run: python scripts/build_native_release.py --version 0.1.0 --output dist/native-ci
      - name: Explicitly validate skill, plugin, manifest, and runtime schemas
        run: python scripts/build_native_release.py --verify-release dist/native-ci/0.1.0 --platform ${{ matrix.platform }}
      - name: Dry-run POSIX installer with local manifest and network forbidden
        if: runner.os != 'Windows'
        run: sh dist/native-ci/0.1.0/install.sh --dry-run --platform ${{ matrix.platform }} --manifest dist/native-ci/0.1.0/csaf-release-manifest.json --data-root "${{ runner.temp }}/csaf-dry-run"
      - name: Dry-run PowerShell installer with local manifest and network forbidden
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File dist/native-ci/0.1.0/install.ps1 -WhatIf -Platform ${{ matrix.platform }} -ManifestPath dist/native-ci/0.1.0/csaf-release-manifest.json -DataRoot "${{ runner.temp }}/csaf-dry-run"
      - name: Recursively scan packaged ZIP and wheel content for secrets
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          packages = sorted(pathlib.Path("dist/native-ci/0.1.0").glob("*.zip"))
          assert packages
          for package in packages:
              subprocess.run([sys.executable, "scripts/check_secrets.py", "--package", str(package)], check=True)
      - run: python -m zipfile -e dist/native-ci/0.1.0/csaf-runtime-${{ matrix.platform }}-0.1.0.zip .native-bundle
      - run: python -m venv .native-smoke
      - name: Install from the bundle with no index (--offline)
        working-directory: .native-bundle
        run: ${{ matrix.smoke-python }} -m pip install --no-index --no-deps --require-hashes --find-links wheelhouse -r requirements.lock
      - name: Exercise csaf setup doctor --json from the private Python
        working-directory: .native-bundle
        shell: python
        run: |
          import subprocess
          import sys
          result = subprocess.run([r"${{ matrix.smoke_csaf }}", "--database", ":memory:", "setup", "doctor", "--json"], check=False, capture_output=True, text=True)
          assert result.returncode in (0, 2), (result.stdout, result.stderr)
          assert result.stdout.lstrip().startswith("{"), result.stdout
      - name: Pre-stage exact pinned uv and OfficeCLI assets
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          platform = "${{ matrix.platform }}"
          dependencies = json.loads(pathlib.Path("installer/dependencies.json").read_text("utf-8"))
          destination = pathlib.Path(".native-assets")
          destination.mkdir()
          for dependency, filename in (("uv", "uv-archive"), ("officecli", "officecli")):
              record = dependencies[dependency]["assets"][platform]
              target = destination / filename
              temporary = target.with_suffix(".part")
              digest = hashlib.sha256()
              total = 0
              with urllib.request.urlopen(record["url"], timeout=120) as response, temporary.open("xb") as output:
                  while chunk := response.read(1024 * 1024):
                      total += len(chunk)
                      if total > record["size"]:
                          raise RuntimeError(f"{dependency} exceeded its pinned size")
                      digest.update(chunk)
                      output.write(chunk)
              if total != record["size"] or digest.hexdigest() != record["sha256"]:
                  raise RuntimeError(f"{dependency} did not match its pinned identity")
              os.replace(temporary, target)
      - name: Install trusted TLS verifier dependency
        run: python -m pip install --require-hashes -r requirements/release-tools.txt
      - name: Run consented install and require READY doctor with external network blocked
        run: >-
          python scripts/verify_native_install.py
          --release-dir dist/native-ci/0.1.0
          --dependencies installer/dependencies.json
          --platform ${{ matrix.platform }}
          --uv .native-assets/uv-archive
          --officecli .native-assets/officecli
          --csaf ${{ matrix.verifier-csaf }}

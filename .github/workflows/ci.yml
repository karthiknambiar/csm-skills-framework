name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python scripts/check_secrets.py --worktree --tracked --history
      - run: pytest
      - run: csaf evaluate evaluations/golden --report evaluation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report-${{ matrix.python-version }}
          path: evaluation-report.json
